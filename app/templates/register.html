{% extends "base.html" %}

{% block title %}Create Account — WorldAmaze{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <a href="/" class="inline-flex items-center space-x-2 mb-4">
            <div class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-white font-bold text-sm tracking-wider">
                W
            </div>
            <span class="font-bold text-xl tracking-tight text-slate-900">WorldAmaze</span>
        </a>
        <h2 class="text-2xl font-bold tracking-tight text-slate-900">Start monitoring the world</h2>
        <p class="mt-2 text-sm text-slate-600">
            Already have an account? <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">Sign in</a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-sm border border-slate-200 sm:rounded-lg sm:px-10">
            {% if error %}
            <div class="mb-4 bg-red-50 border-l-4 border-red-500 p-3 rounded">
                <p class="text-sm text-red-700">{{ error }}</p>
            </div>
            {% endif %}

            <form class="space-y-5" action="/register" method="POST">
                <div>
                    <label for="full_name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Full Name</label>
                    <div class="mt-1">
                        <input id="full_name" name="full_name" type="text" placeholder="Intelligence Analyst"
                               class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-sm">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Email address</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                               class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password (min 8 chars)</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required
                               class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-sm">
                    </div>
                </div>

                <div>
                    <label for="timezone" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Timezone</label>
                    <div class="mt-1">
                        <select id="timezone" name="timezone" class="block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm bg-white text-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            <option value="UTC" selected>UTC (Coordinated Universal Time)</option>
                            <option value="America/New_York">America/New_York (US Eastern)</option>
                            <option value="America/Chicago">America/Chicago (US Central)</option>
                            <option value="America/Los_Angeles">America/Los_Angeles (US Pacific)</option>
                            <option value="Europe/London">Europe/London (GMT/BST)</option>
                            <option value="Europe/Paris">Europe/Paris (CET)</option>
                            <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
                            <option value="Asia/Singapore">Asia/Singapore (SGT)</option>
                            <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
