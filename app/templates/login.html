{% extends "base.html" %}

{% block title %}Sign in — WorldAmaze{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <a href="/" class="inline-flex items-center space-x-2 mb-4">
            <div class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center text-white font-bold text-sm tracking-wider">
                W
            </div>
            <span class="font-bold text-xl tracking-tight text-slate-900">WorldAmaze</span>
        </a>
        <h2 class="text-2xl font-bold tracking-tight text-slate-900">Sign in to your workspace</h2>
        <p class="mt-2 text-sm text-slate-600">
            Or <a href="/register" class="font-medium text-blue-600 hover:text-blue-500">create a new account</a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-sm border border-slate-200 sm:rounded-lg sm:px-10">
            {% if error %}
            <div class="mb-4 bg-red-50 border-l-4 border-red-500 p-3 rounded">
                <p class="text-sm text-red-700">{{ error }}</p>
            </div>
            {% endif %}

            <form class="space-y-5" action="/login" method="POST">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Email address</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                               class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                               class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-colors">
                        Sign in
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
